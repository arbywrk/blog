<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{{ config.description }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') | safe }}">
  <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
</head>
<body>
  <header>
    <div class="container">
      <div class="header-left">
        <h1><a href="{{ config.base_url | safe }}">{{ config.title }}</a></h1>
        <nav>
          <a href="{{ config.base_url | safe }}">posts</a>
          <a href="{{ config.base_url | safe }}/about">about</a>
        </nav>
      </div>
      <button class="theme-toggle" aria-label="Toggle dark mode">
        <span class="toggle-track">
          <span class="toggle-thumb">
            <!-- sun: shown in light mode -->
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <line x1="12" y1="2"  x2="12" y2="5"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
              <line x1="4.93" y1="4.93"   x2="7.05" y2="7.05"/>
              <line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/>
              <line x1="2"  y1="12" x2="5"  y2="12"/>
              <line x1="19" y1="12" x2="22" y2="12"/>
              <line x1="4.93" y1="19.07"  x2="7.05" y2="16.95"/>
              <line x1="16.95" y1="7.05"  x2="19.07" y2="4.93"/>
            </svg>
            <!-- moon: shown in dark mode -->
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </span>
        </span>
      </button>
    </div>
  </header>

  <main>
    <div class="container">
      {% block content %}{% endblock content %}
    </div>
  </main>

  <footer>
    <div class="container">
      &copy; {{ now() | date(format="%Y") }} {{ config.extra.author }}
    </div>
  </footer>

  <script>
    (function () {
      var btn = document.querySelector('.theme-toggle');
      btn.addEventListener('click', function () {
        var isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    })();
  </script>
</body>
</html>
