{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ config.title }}{% endblock title %}

{% block content %}
<article>
  <header>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date(format="%d.%m.%Y") }}</p>
  </header>
  <div class="post-body">
    {{ page.content | safe }}
  </div>
  <div class="back">
    <a href="{{ config.base_url | safe }}">&larr; all posts</a>
  </div>
</article>
{% endblock content %}
